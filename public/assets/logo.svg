<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#ff3311" />
    </linearGradient>
  </defs>
  <!-- Futuristic text styling -->
  <text x="300" y="100" font-family="monospace, sans-serif" font-size="80" font-weight="900" 
        fill="url(#grad)" filter="url(#glow)" text-anchor="middle" letter-spacing="8">
    MOONSEC
  </text>
  <!-- Subtitle -->
  <text x="300" y="130" font-family="monospace, sans-serif" font-size="16" font-weight="bold" 
        fill="#aaddff" text-anchor="middle" letter-spacing="4">
    LUNAR BASE RECLAMATION PROTOCOL
  </text>
</svg>
